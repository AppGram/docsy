# Content, branding, ingestion, navigation, and permission gates live here.
# The interface itself remains editable source under src/.
site:
  name: Docsy
  docsLabel: docs
  title: Docsy Documentation
  description: Build, configure, customize, and self-host a source-owned documentation portal with Docsy.
  origin: ${DOCSY_ORIGIN:-https://appgram.github.io}
  basePath: /docsy
  language: en
  homeUrl: /docsy/
  logo: assets/docsy-logo.png
  favicon: assets/docsy-logo.png
  githubUrl: https://github.com/AppGram/docsy
header:
  searchLabel: Search documentation
  searchPlaceholder: Search Docsy guides and reference
  llmLabel: Markdown
  cta:
    label: View on GitHub
    href: https://github.com/AppGram/docsy
theme:
  mode: light
home:
  eyebrow: DOCSY DOCUMENTATION
  title: Documentation you actually own.
  description: Configure the content in YAML, write guides in Markdown, ingest API metadata, and ship an editable Astro site on your own infrastructure.
  primaryAction:
    label: Get started →
    href: /guides/getting-started
  secondaryAction:
    label: Read the configuration guide
    href: /guides/tutorials/yaml-configuration
  sdkHeading: Documentation
  sdkDescription: Guides and reference for building with Docsy.
content:
  articles:
    - slug: getting-started
      source: content/getting-started.md
      title: Get started with Docsy
      description: Run the documentation portal, generate a new project, and understand what Docsy owns.
      eyebrow: GET STARTED
    - slug: tutorials/yaml-configuration
      source: content/tutorials/yaml-configuration.md
      title: Configure Docsy with YAML
      description: Understand how docsy.config.yaml controls product copy, navigation, visual tokens, content, and access.
      eyebrow: TUTORIAL
    - slug: tutorials/authored-articles
      source: content/tutorials/authored-articles.md
      title: Write authored documentation
      description: Add Markdown guides and articles beside generated API and SDK reference pages.
      eyebrow: TUTORIAL
    - slug: tutorials/openapi-ingestion
      source: content/tutorials/openapi-ingestion.md
      title: Ingest an OpenAPI document
      description: Turn a local or remote OpenAPI source into grouped, searchable API reference pages.
      eyebrow: TUTORIAL
    - slug: ingestion/sdk-adapters
      source: content/ingestion/sdk-adapters.md
      title: Ingest SDK documentation
      description: Normalize TypeDoc, Swift symbol, and Dart documentation into consistent SDK reference pages.
      eyebrow: INGESTION
    - slug: customization/default-ui
      source: content/customization/default-ui.md
      title: Customize the default UI
      description: Change branding and theme tokens in YAML, then edit the source-owned Astro interface when needed.
      eyebrow: CUSTOMIZATION
    - slug: tutorials/lock-mode
      source: content/tutorials/lock-mode.md
      title: Protect documentation by tier
      description: Configure server-side documentation permissions using ordered YAML rules.
      eyebrow: TUTORIAL
    - slug: deployment/github-pages
      source: content/deployment/github-pages.md
      title: Deploy to GitHub Pages
      description: Publish an open-mode Docsy site from GitHub Actions with the correct origin and base path.
      eyebrow: DEPLOYMENT
    - slug: deployment/self-hosting
      source: content/deployment/self-hosting.md
      title: Self-host Docsy
      description: Deploy static documentation or run locked mode with the standalone Node server and Docker.
      eyebrow: DEPLOYMENT
    - slug: reference/cli
      source: content/reference/cli.md
      title: CLI reference
      description: Generate projects, validate configuration, build releases, and run production previews.
      eyebrow: REFERENCE
access:
  mode: open
navigation:
  - title: Introduction
    items:
      - title: Overview
        href: /
      - title: Get started
        href: /guides/getting-started
  - title: Content
    items:
      - title: YAML configuration
        href: /guides/tutorials/yaml-configuration
      - title: Authored articles
        href: /guides/tutorials/authored-articles
  - title: Ingestion
    items:
      - title: OpenAPI ingestion
        href: /guides/tutorials/openapi-ingestion
      - title: SDK adapters
        href: /guides/ingestion/sdk-adapters
  - title: Customization
    items:
      - title: Default UI
        href: /guides/customization/default-ui
  - title: Access and deployment
    items:
      - title: Lock mode
        href: /guides/tutorials/lock-mode
      - title: GitHub Pages
        href: /guides/deployment/github-pages
      - title: Self-hosting
        href: /guides/deployment/self-hosting
  - title: Reference
    items:
      - title: CLI
        href: /guides/reference/cli
ingestion:
  sdks: []
  openapi:
    enabled: false
    source: sources/openapi.json
    apiBaseUrl: https://api.example.com
    sections: []
