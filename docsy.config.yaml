# Content, branding, ingestion, navigation, and permission gates live here.
# The interface itself remains editable source under src/.
site:
  name: Docsy
  docsLabel: docs
  title: Docsy by AppGram — Documentation you own
  description: Own your documentation. Self-host Markdown, OpenAPI, and native SDK reference with YAML configuration, editable source, and tools for humans and coding agents.
  origin: ${DOCSY_ORIGIN:-https://appgram.github.io}
  basePath: /docsy
  language: en
  homeUrl: /docsy/
  logo: assets/docsy-logo.png
  logoDark: assets/docsy-logo-dark.png
  favicon: assets/docsy-logo.png
  githubUrl: https://github.com/AppGram/docsy
header:
  searchLabel: Search documentation
  searchPlaceholder: Search Docsy guides and reference
  llmLabel: Markdown
footer:
  prefix: Docsy provided by
  label: AppGram
  href: https://github.com/AppGram
reader:
  headingLinks: true
  showByline: true
  defaultAuthorAvatar: assets/authors/unknown.svg
  unknownAuthorAvatar: assets/authors/unknown.svg
  editEnabled: true
  editPlacement: footer
  editStyle: subtle
  editUrl: https://github.com/AppGram/docsy/edit/main/{source}
  reportUrl: https://github.com/AppGram/docsy/issues/new
eyebrow:
  icon: assets/docsy-logo.svg
  size: 14
theme:
  mode: light
  code:
    lightTheme: github-light
    darkTheme: github-dark-high-contrast
versions:
  default: current
  items:
    - id: current
      label: Current
    - id: preview
      label: Preview (demo)
      status: beta
localization:
  defaultLocale: en
  fallback: true
  locales:
