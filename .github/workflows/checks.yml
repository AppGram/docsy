name: Validate Docsy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docsy-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node tests and portal build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Detect public static preview
        id: preview
        run: node --import tsx --input-type=module -e "import {isServer} from './src/config.ts'; import {appendFileSync} from 'node:fs'; appendFileSync(process.env.GITHUB_OUTPUT, 'static=' + !isServer + '\n');"
      # Downloadable, repository-scoped build artifact; never a hosted PR deployment.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.preview.outputs.static == 'true'
        with:
          name: docsy-static-preview-${{ github.event.pull_request.number || github.run_id }}
          path: release
          if-no-files-found: error
          retention-days: 7

  native-imports:
    name: Real native generator imports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Real upstream libraries through native generators and rendered pages
        run: npm run test:imports:real
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: native-import-evidence
          path: |
            .docsy/real-projects/report.json
            .docsy/real-projects/render-build.log
          include-hidden-files: true
          retention-days: 7
  bun-runtime:
    name: Bun production runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - run: npm ci --ignore-scripts
      - run: npm run test:runtime:bun

  package:
    name: Installed npm tarball end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run test:package

  ci:
    name: PR checks
    if: always()
    needs: [check, native-imports, bun-runtime, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job to pass
        env:
          DOCSY_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const jobs = JSON.parse(process.env.DOCSY_JOB_RESULTS); for (const [name, job] of Object.entries(jobs)) { console.log(`${name} → ${job.result}`); if (job.result !== "success") process.exitCode = 1; }'

  pages:
    name: Deploy approved main build
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCSY_ENABLE_PAGES == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
