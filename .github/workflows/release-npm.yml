name: Prepare or publish npm package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified tarball to npm (separate gate and confirmation required)
        type: boolean
        default: false
      confirmation:
        description: 'For publication only: type @appgram/docsy@VERSION exactly'
        type: string
        required: false
      npm_tag:
        description: npm distribution tag
        type: choice
        options: [latest, next, beta]
        default: latest

permissions:
  contents: read

concurrency:
  group: docsy-npm-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'AppGram/docsy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Pack, install, generate, validate, build and serve the actual archive
        run: npm run test:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-release-${{ github.sha }}
          path: |
            .docsy/packages/release/*.tgz
            .docsy/packages/release/package-manifest.json
            .docsy/packages/release/package-test.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish == true && vars.DOCSY_ENABLE_NPM_PUBLISH == 'true'
    needs: verify
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-${{ github.sha }}
          path: .docsy/packages/release
      - name: Check confirmation and publish only the exact tested tarball using OIDC
        run: node scripts/release/publish.mjs
        env:
          DOCSY_ENABLE_NPM_PUBLISH: ${{ vars.DOCSY_ENABLE_NPM_PUBLISH }}
          DOCSY_RELEASE_REQUESTED: ${{ inputs.publish }}
          DOCSY_CONFIRM_NPM_PUBLISH: ${{ inputs.confirmation }}
          DOCSY_NPM_TAG: ${{ inputs.npm_tag }}
